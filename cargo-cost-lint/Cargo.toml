[package]
name = "cargo-cost-lint"
version = "0.1.1"
edition = "2021"
description = "A static analysis linter for Soroban smart contracts"
license = "Apache-2.0"
repository = "https://github.com/Tollcraft/soroban-cost-linter"
readme = "../README.md"
keywords = ["soroban", "stellar", "wasm", "linter", "cost", "cargo"]
categories = ["development-tools:cargo-plugins"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
clap = { version = "4.0", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
