[package]
name = "cargo-cost-lint"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tabled = "0.15"
ignore = "0.4"
toml = "0.8"
anyhow = "1.0"
indicatif = "0.17"

[dev-dependencies]
tempfile = "3.8"
assert_cmd = "2.0"
predicates = "3.0"

[[bin]]
name = "cargo-cost-lint"
path = "src/main.rs"
